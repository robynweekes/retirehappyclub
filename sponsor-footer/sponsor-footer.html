<!-- Sponsor thank-you footer markup for spookyseason.teachery.co -->
<!-- Paste this into a Custom HTML block / Footer Code field (NOT the Custom CSS field) -->
<!-- Styles live in sponsor-footer.css - paste that into Site settings -> Custom CSS -->
<!-- To add more sponsors, copy one .sponsor-footer__item block and repeat it inside .sponsor-footer__list -->

<footer class="sponsor-footer">
  <p class="sponsor-footer__label">With thanks to our sponsor</p>
  <div class="sponsor-footer__list">
    <a
      class="sponsor-footer__item"
      href="https://theretirehappyclub.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        class="sponsor-footer__logo"
        src="https://theretirehappyclub.com/path/to/logo.png"
        alt="The Retire Happy Club logo"
      />
      <span class="sponsor-footer__name">The Retire Happy Club</span>
    </a>
  </div>
</footer>
