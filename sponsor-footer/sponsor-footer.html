        src="https://theretirehappyclub.com/path/to/logo.png"
        alt="The Retire Happy Club logo"

    <a class="sponsor-footer__item" href="https://sponsor2.example.com/" target="_blank" rel="noopener noreferrer">
      <img class="sponsor-footer__logo" src="PASTE_LOGO_URL_2" alt="Sponsor 2 logo" />
